<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Geometric TD — Co-op Connection Spike</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #080b12; color: #e8fbff; }
    main { width: min(100% - 32px, 520px); margin: 0 auto; padding: 48px 0; }
    h1 { margin: 0 0 8px; color: #4defff; font-size: clamp(24px, 7vw, 36px); }
    .muted { color: #91a4ad; line-height: 1.5; }
    section { margin-top: 24px; padding: 20px; border: 1px solid #27434c; border-radius: 10px; background: #0d141e; }
    h2 { margin: 0 0 14px; font-size: 15px; letter-spacing: .12em; color: #ff3fd4; }
    .row { display: flex; gap: 10px; min-width: 0; }
    input, button { min-height: 44px; border: 1px solid #3d6874; border-radius: 6px; font: inherit; }
    input { min-width: 0; flex: 1; padding: 0 12px; background: #070b10; color: #fff; text-transform: uppercase; letter-spacing: .14em; }
    button { padding: 0 16px; background: #102b34; color: #dffcff; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    output { display: block; }
    #room-code { min-height: 1.3em; margin-top: 14px; color: #ffe66d; font-size: 30px; letter-spacing: .18em; }
    #connection-state, #round-trip { color: #75ffb0; font-size: 20px; }
    #detail { min-height: 1.5em; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Co-op Connection Spike</h1>
    <p class="muted">Disposable WebRTC/Supabase test page. It is not part of the player menu and touches no gameplay.</p>

    <section>
      <h2>Host</h2>
      <button id="host-button" type="button">HOST</button>
      <output id="room-code" aria-live="polite">—</output>
    </section>

    <section>
      <h2>Join</h2>
      <div class="row">
        <input id="join-code" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code" />
        <button id="join-button" type="button">JOIN</button>
      </div>
    </section>

    <section>
      <h2>Connection</h2>
      <output id="connection-state" aria-live="polite">idle</output>
      <p id="detail" class="muted" aria-live="polite"></p>
      <div class="row">
        <button id="ping-button" type="button" disabled>PING CMD</button>
        <button id="close-button" type="button" disabled>CLOSE</button>
      </div>
    </section>

    <section>
      <h2>Ping-pong round trip</h2>
      <output id="round-trip" aria-live="polite">—</output>
    </section>

    <!-- Phase 0 is a diagnosis exercise: a phone that only says "it didn't
         work" costs a whole test cycle. This names the failing step. -->
    <section>
      <h2>Diagnostics</h2>
      <pre id="diagnostics" class="muted">—</pre>
    </section>

    <!-- The timeline is the point. A connection that works and then dies a
         minute later is only diagnosable if you can see how long it lasted
         and what state it passed through on the way down. -->
    <section>
      <h2>Event log</h2>
      <pre id="event-log" class="muted">—</pre>
    </section>
  </main>

  <script type="module">
    import { COOP } from "./src/config.js";
    // NAMESPACE import, deliberately — do not switch this back to named
    // imports. A named import of an export the loaded net.js does not have is
    // a LINK-TIME error: the whole module script fails to instantiate, no
    // listeners attach, and every button on this page goes silently dead.
    // That is not hypothetical — it happened on a real device, when a phone
    // paired this page with a cached older net.js after a push (the
    // stale-module mixing HANDOFF.md warns about). A namespace import
    // degrades to `undefined` instead of killing the page.
    import * as net from "./src/net.js";

    const { closeSession, hostSession, joinSession, onConnectionState, onMessage, sendMessage } = net;

    // Poll rather than subscribe: these are peer-connection internals, not
    // connection-state transitions, and they change without any state change
    // (which is exactly the stall we are hunting).
    const diagnosticsBox = document.querySelector("#diagnostics");
    setInterval(() => {
      if (typeof net.getDiagnostics !== "function") {
        diagnosticsBox.textContent =
          "diagnostics unavailable — net.js is older than this page.\n" +
          "Hard-refresh to clear a cached module.";
        return;
      }
      const d = net.getDiagnostics();
      diagnosticsBox.textContent =
        `step:      ${d.step ?? "—"}\n` +
        `state:     ${d.state}\n` +
        `role:      ${d.role ?? "—"}\n` +
        `peer:      ${d.peer ?? "—"}\n` +
        `ice gath:  ${d.iceGathering ?? "—"}\n` +
        `ice conn:  ${d.iceConnection ?? "—"}\n` +
        `signaling: ${d.signaling ?? "—"}\n` +
        `candidates:${d.localCandidates ?? 0}` +
        (d.candidateTypes
          ? ` (host ${d.candidateTypes.host}${d.candidateTypes.mdns ? `/${d.candidateTypes.mdns} mDNS` : ""}` +
            `, srflx ${d.candidateTypes.srflx}, relay ${d.candidateTypes.relay})`
          : "") + "\n" +
        `ice hist:  ${(d.iceHistory || []).join(" > ") || "—"}\n` +
        (d.iceErrors && d.iceErrors.length ? `ice errs:  ${d.iceErrors.join(" | ")}\n` : "") +
        `connected: ${d.connectedSeconds != null ? d.connectedSeconds + "s" : "—"}\n` +
        `cmd chan:  ${d.channels?.cmd ?? "—"}\n` +
        `state chan:${d.channels?.state ?? "—"}` +
        (d.stale ? "\n\n(session ended — values are the last known)" : "");
    }, 500);

    const hostButton = document.querySelector("#host-button");
    const joinButton = document.querySelector("#join-button");
    const joinCode = document.querySelector("#join-code");
    const roomCode = document.querySelector("#room-code");
    const connectionState = document.querySelector("#connection-state");
    const detail = document.querySelector("#detail");
    const pingButton = document.querySelector("#ping-button");
    const closeButton = document.querySelector("#close-button");
    const roundTrip = document.querySelector("#round-trip");

    joinCode.maxLength = COOP.roomCodeLength;
    joinCode.placeholder = `${COOP.roomCodeLength}-character code`;

    let pingSequence = 0;
    const pendingPings = new Map();

    hostButton.addEventListener("click", async () => {
      resetReadouts();
      try {
        const pending = hostSession();
        roomCode.textContent = pending.code;
        await pending;
      } catch (error) {
        detail.textContent = error.message;
      }
    });

    joinButton.addEventListener("click", async () => {
      resetReadouts();
      try {
        await joinSession(joinCode.value);
      } catch (error) {
        detail.textContent = error.message;
      }
    });

    joinCode.addEventListener("input", () => {
      joinCode.value = joinCode.value.toUpperCase();
    });
    joinCode.addEventListener("keydown", (event) => {
      if (event.key === "Enter") joinButton.click();
    });

    pingButton.addEventListener("click", sendPing);
    closeButton.addEventListener("click", () => closeSession());

    const eventLogBox = document.querySelector("#event-log");
    const pageOpenedAt = Date.now();
    const eventLog = [];
    function logEvent(text) {
      const t = ((Date.now() - pageOpenedAt) / 1000).toFixed(1).padStart(6, " ");
      eventLog.push(`${t}s  ${text}`);
      eventLogBox.textContent = eventLog.join("\n");
    }

    onConnectionState((event) => {
      const connected = event.state === "connected";
      connectionState.textContent = event.state;
      // "disconnected" belongs in the re-enable list: without it a dropped
      // session leaves every button dead and the only way to retry is a
      // page reload.
      const idle = ["idle", "failed", "closed", "disconnected"].includes(event.state);
      hostButton.disabled = !idle;
      joinButton.disabled = !idle;
      joinCode.disabled = !idle;
      pingButton.disabled = !connected;
      closeButton.disabled = ["idle", "failed", "closed"].includes(event.state);
      if (event.error) detail.textContent = event.error;
      logEvent(
        `${event.previous} -> ${event.state}` + (event.error ? `  ERROR: ${event.error}` : "")
      );
      if (connected && event.previous !== "connected") sendPing();
    });

    onMessage(({ channel, data }) => {
      if (channel !== "cmd" || typeof data !== "string") return;
      let message;
      try {
        message = JSON.parse(data);
      } catch {
        return;
      }

      if (message.type === "ping") {
        sendMessage("cmd", { type: "pong", id: message.id });
        return;
      }
      if (message.type !== "pong" || !pendingPings.has(message.id)) return;

      const elapsed = performance.now() - pendingPings.get(message.id);
      pendingPings.delete(message.id);
      roundTrip.textContent = `${elapsed.toFixed(1)} ms`;
    });

    function sendPing() {
      const id = `${Date.now()}-${++pingSequence}`;
      pendingPings.set(id, performance.now());
      roundTrip.textContent = "measuring…";
      try {
        sendMessage("cmd", { type: "ping", id });
      } catch (error) {
        pendingPings.delete(id);
        detail.textContent = error.message;
      }
    }

    function resetReadouts() {
      pendingPings.clear();
      roundTrip.textContent = "—";
      detail.textContent = "";
    }

    // Tells the watchdog below that the module actually ran.
    window.__spikeReady = true;
  </script>

  <!-- Watchdog. A CLASSIC script, not a module, so it runs even when the
       module script above fails to instantiate. If a module fails to link
       (a missing export, a stale cached net.js, a syntax error), the browser
       reports it only in the console and every button silently stops
       working — which on a phone is indistinguishable from "the page is
       broken". This turns that into a visible message. -->
  <script>
    setTimeout(function () {
      if (window.__spikeReady) return;
      var box = document.getElementById("diagnostics");
      var msg =
        "PAGE SCRIPT FAILED TO LOAD.\n\n" +
        "The buttons on this page will do nothing.\n" +
        "Almost always a stale cached module after a deploy.\n\n" +
        "Fix: hard-refresh. On iOS Safari, Settings > Apps > Safari >\n" +
        "Clear History and Website Data, or open the page in a\n" +
        "Private tab.";
      if (box) {
        box.textContent = msg;
        box.style.color = "#ff6b6b";
      }
      var detail = document.getElementById("detail");
      if (detail) detail.textContent = "Page script failed to load — see Diagnostics.";
    }, 2000);
  </script>
</body>
</html>
